# Routes a citizen's wallet and the verifier page need
#
# Public by design: this is the demo. Everything here is either read-only
# metadata, a protocol endpoint that authenticates its own caller, or the
# verifier page.
# Included by every server block that serves it. See nginx.conf (plain HTTP),
# nginx-tls.conf (HTTPS) and the operator listener in both.

resolver 127.0.0.11 valid=10s ipv6=off;

# Generous, because amd64 emulation makes the Java registry slow to answer.
proxy_connect_timeout 30s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# --- the verifier experience ---------------------------------------------
# Static page; no build step. The browser only ever talks to /api/verifier,
# never to oid4vc-service directly — the APPROVED/DENIED decision is made
# server-side, so it cannot be a UI-only simulation.

# --- the verifier experience ---------------------------------------------
# Static page; no build step. The browser only ever talks to /api/verifier,
# never to oid4vc-service directly — the APPROVED/DENIED decision is made
# server-side, so it cannot be a UI-only simulation.
location = /verifier { return 301 /verifier/; }
location /verifier/ {
    alias /usr/share/nginx/html/verifier/;
    index index.html;
    add_header Cache-Control "no-store";
}

location /api/verifier/ {
    set $up http://verifier:4300;
    rewrite ^/api/verifier/(.*)$ /$1 break;
    proxy_pass $up;
}

# --- the bank experience (Iteration 02) ----------------------------------
# The customer-facing channel for Agriculture is cross-device web QR, so this is
# the page a farmer's phone scans from. Same arrangement as the age page: static,
# no build step, and it talks only to /api/verifier — the eligibility decision and
# the loan figure are produced server-side, so neither can be a UI-only
# simulation.
location = /bank { return 301 /bank/; }
location /bank/ {
    alias /usr/share/nginx/html/bank/;
    index index.html;
    add_header Cache-Control "no-store";
}

# --- the two Education relying parties (Iteration 03) --------------------
# Two pages, ONE directory: services/education-web holds both HTML files and the
# single app.js they share, and the only difference between them is the
# data-policy attribute in the markup. That is the point — the university and the
# employer must differ because their POLICY differs, not because two front ends
# were written differently, and sharing the script makes that structural.
#
# Same arrangement as the age and bank pages otherwise: static, no build step,
# and both talk only to /api/verifier — the verdict and its wording are produced
# server-side, so neither can be a UI-only simulation.
location = /admissions { return 301 /admissions/; }
location /admissions/ {
    alias /usr/share/nginx/html/education/;
    index masters.html;
    add_header Cache-Control "no-store";
}

location = /employer { return 301 /employer/; }
location /employer/ {
    alias /usr/share/nginx/html/education/;
    index job.html;
    add_header Cache-Control "no-store";
}

# No /issuer/ page. The revised charter requires issuance to be initiated
# and completed inside the wallet: "Do not use a QR code for issuance. Do
# not require an issuer-counter web page to start issuance." The page that
# used to live here rendered an issuance QR, which the review rejected.

# Issuer directory for wallets built on the Brazil Inji SDK, which list issuers
# from a mimoto backend (GET {baseUrl}/v1/mimoto/issuers) before anything else
# and refuse to start without it. One static entry: this deployment's age
# issuer. The SDK then reads the issuer's own metadata from
# credential_issuer_host. No mimoto service is run.
location = /v1/mimoto/issuers {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"response":{"issuers":[{"issuer_id":"age","protocol":"OpenId4VCI","enabled":"true","order":1,"display":[{"name":"National Identity Authority","language":"en","locale":"en","logo":{"url":"","alt_text":"National Identity Authority"},"title":"Age Verification Credential","description":"Age over 16 / over 18"}],"credential_issuer":"$scheme://$host","credential_issuer_host":"$scheme://$host","client_id":"inji-sdk-demo","wellknown_endpoint":"$scheme://$host/.well-known/openid-credential-issuer"}]}}';
}

# Stylesheet and font, shared by the pages that remain.
location /assets/ {
    alias /usr/share/nginx/html/assets/;
    add_header Cache-Control "no-store";
}

location /auth {
    set $up http://keycloak:8080;
    proxy_pass $up;
}

# The redirect target the wallet registers with the authorization server
# (apps/wallet/app.config.js -> allowedRedirectBaseUrls[0]). The wallet
# intercepts this path itself via its App Link handler; serving a page here
# only matters when the interception does not happen, so make the failure
# legible instead of a 404.
location = /wallet/redirect {
    default_type text/html;
    return 200 '<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Return to the wallet</title><body style="font:16px system-ui;padding:2rem;max-width:32rem"><h1>Sign-in complete</h1><p>If the wallet did not reopen automatically, switch back to it manually — the authorization code is in this page URL and the wallet reads it from there.</p></body>';
}

# --- Iteration 02: the two Agriculture issuers ---------------------------
#
# Each registry is its own oid4vc-service instance, and its metadata says
# credential_issuer = <host>/farmer or <host>/land. The trailing slash on both
# the location and the proxy_pass is what strips the prefix, so the instance
# still serves /.well-known/openid-credential-issuer, /oid4vc/* and /vct/* at
# its own root and needs no knowledge of the path it is published under.
#
# Same conditional-request handling as /vct below, and for the same reason: a
# wallet that revalidates a credential-type document and gets an empty 304 fails
# verification with nothing useful on screen.
# The prefix is stripped with an explicit rewrite, NOT by a trailing slash on
# proxy_pass: every upstream here is named through a variable so nginx resolves it
# per request, and a variable proxy_pass passes the URI through UNCHANGED — the
# trailing-slash form silently does nothing. The /api/verifier/ route below uses
# the same rewrite for the same reason.
location /farmer/ {
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    add_header Cache-Control "no-store" always;
    set $up http://oid4vc-farmer:3400;
    rewrite ^/farmer/(.*)$ /$1 break;
    proxy_pass $up;
}

location /land/ {
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    add_header Cache-Control "no-store" always;
    set $up http://oid4vc-land:3400;
    rewrite ^/land/(.*)$ /$1 break;
    proxy_pass $up;
}

# --- Iteration 03: the three Education issuers ---------------------------
#
# The same arrangement as the two Agriculture registries above, three times over:
# each institution is its own oid4vc-service instance whose metadata says
# credential_issuer = <host>/school, /college or /university, and each is
# published under exactly that prefix so a wallet resolving the issuer it was
# told about reaches the instance that named itself.
#
# Three prefixes rather than one shared one, because to a wallet a path IS an
# issuer identity: sharing a prefix would make the three institutions one issuer
# on the consent screen, which is the opposite of what this iteration is showing.
location /school/ {
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    add_header Cache-Control "no-store" always;
    set $up http://oid4vc-school:3400;
    rewrite ^/school/(.*)$ /$1 break;
    proxy_pass $up;
}

location /college/ {
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    add_header Cache-Control "no-store" always;
    set $up http://oid4vc-college:3400;
    rewrite ^/college/(.*)$ /$1 break;
    proxy_pass $up;
}

location /university/ {
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    add_header Cache-Control "no-store" always;
    set $up http://oid4vc-university:3400;
    rewrite ^/university/(.*)$ /$1 break;
    proxy_pass $up;
}

# --- OID4VCI / OID4VP wallet-facing endpoints ----------------------------
location /oid4vc {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

location /vp {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

# The bank's own OID4VP signer, published under its own prefix so that the
# request_uri inside the QR resolves back to the instance that signed it.
#
# The rewrite is not optional: with `proxy_pass $up` the URI is NOT rewritten
# from the location prefix, because a variable in proxy_pass disables that. The
# instance would receive /bank-vp/vp/request and answer 404, which surfaces on a
# phone as a wallet that simply cannot fetch the request.
location /bank-vp/ {
    # `set` BEFORE `rewrite ... break`: both are rewrite-module directives and
    # `break` ends that phase, so a `set` after it never runs, $up is empty and
    # nginx answers 500. Same ordering as the /farmer/ and /land/ routes above.
    set $up http://oid4vc-bank:3400;
    rewrite ^/bank-vp/(.*)$ /$1 break;
    proxy_pass $up;
}

# The two Education relying parties' own OID4VP signers, published under their
# own prefixes for the same reason the bank's is: the request_uri inside the QR
# must resolve back to the instance that signed the request object.
#
# `set` BEFORE `rewrite ... break` in both — `break` ends the rewrite phase, so a
# `set` after it never runs, $up is empty and nginx answers 500.
location /university-vp/ {
    set $up http://oid4vc-university-vp:3400;
    rewrite ^/university-vp/(.*)$ /$1 break;
    proxy_pass $up;
}

location /employer-vp/ {
    set $up http://oid4vc-employer-vp:3400;
    rewrite ^/employer-vp/(.*)$ /$1 break;
    proxy_pass $up;
}

location /vct {
    # A wallet that revalidates gets 304 with NO BODY, and a DID document or a
    # credential-type document that arrives empty fails verification with nothing
    # more useful than "something went wrong" on the phone. Both documents are
    # small and change only when the stack is re-bootstrapped, so caching them
    # buys nothing and costs correctness: strip the conditional request so the
    # upstream always answers 200, and tell the client not to store it.
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    add_header Cache-Control "no-store" always;
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

location /contexts {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

location /render-templates {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

location /qr {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

location = /.well-known/openid-credential-issuer {
    set $up http://oid4vc-service:3400;
    proxy_pass $up/.well-known/openid-credential-issuer;
}

location = /.well-known/openid-configuration {
    set $up http://oid4vc-service:3400;
    proxy_pass $up/.well-known/openid-configuration;
}

location = /.well-known/oauth-authorization-server {
    set $up http://oid4vc-service:3400;
    proxy_pass $up/.well-known/oauth-authorization-server;
}

location = /.well-known/jwks.json {
    set $up http://oid4vc-service:3400;
    proxy_pass $up/.well-known/jwks.json;
}

location /.well-known/vct {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

# did:web documents live at /<uuid>/did.json. The `{36}` MUST sit inside a
# quoted regex — unquoted, nginx reads the brace as a block and refuses to
# start.
location ~ "^/[0-9a-fA-F-]{36}/did\.json$" {
    # A wallet that revalidates gets 304 with NO BODY, and a DID document or a
    # credential-type document that arrives empty fails verification with nothing
    # more useful than "something went wrong" on the phone. Both documents are
    # small and change only when the stack is re-bootstrapped, so caching them
    # buys nothing and costs correctness: strip the conditional request so the
    # upstream always answers 200, and tell the client not to store it.
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    add_header Cache-Control "no-store" always;
    set $up http://identity:3332;
    proxy_pass $up;
}

# --- health probes -------------------------------------------------------
# Distinct prefixes per backend: they all serve /health, so the gateway
# needs a unique path for each to be reachable.
location = /gateway-health {
    default_type text/plain;
    return 200 "ok\n";
}

location = /health {
    set $up http://oid4vc-service:3400;
    proxy_pass $up/health;
}

location = /identity-health {
    set $up http://identity:3332;
    proxy_pass $up/health;
}

location = /schema-health {
    set $up http://credential-schema:3333;
    proxy_pass $up/health;
}

location = /credential-health {
    set $up http://credential:3000;
    proxy_pass $up/health;
}

location = /registry-health {
    set $up http://registry:8081;
    proxy_pass $up/health;
}

location = /issuer-health {
    set $up http://age-issuer:4200;
    proxy_pass $up/healthz;
}

location = /verifier-health {
    set $up http://verifier:4300;
    proxy_pass $up/healthz;
}

location = / { return 302 /verifier/; }
