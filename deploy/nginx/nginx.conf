# Plain-HTTP gateway.
#
# Two listeners, and the difference between them is the whole point:
#
#   :80    what the internet sees — citizen and wallet routes only
#   :8088  the operator listener, published on 127.0.0.1 only, which ALSO serves
#          the unauthenticated operator endpoints bootstrap.sh and the tests use
#
# `resolver` plus a variable in proxy_pass is used throughout (see
# routes-citizen.conf) so nginx re-resolves container names per request.
# --- /try/: real visitor IP and the test-citizen rate limit ----------------
# The public /try/ page lets anyone create a test citizen, so creation is rate-
# limited per visitor. Where this gateway sits behind another proxy (the dev
# host's shared nginx, which sends X-Real-IP), the visitor's address is taken
# from that header, but only when the request comes from a Docker bridge or
# loopback address. ponytail: on a stack published straight to the internet
# through Docker's NAT, a client could set X-Real-IP itself and dodge the limit;
# fine for a demo, put a trusted proxy in front for anything more.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header   X-Real-IP;
limit_req_zone   $binary_remote_addr zone=try_citizens:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    include /etc/nginx/routes-citizen.conf;
    include /etc/nginx/routes-trust.conf;
    include /etc/nginx/routes-denied.conf;
}

server {
    listen 8088;
    server_name _;

    include /etc/nginx/routes-citizen.conf;
    include /etc/nginx/routes-ops.conf;
}
