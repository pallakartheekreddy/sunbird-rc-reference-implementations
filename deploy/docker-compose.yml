# Iteration 01 — Age Verification: reproducible local stack.
#
#   cp env.example .env && docker compose up -d && ../scripts/bootstrap.sh
#
# Everything Sunbird RC is PULLED at the pinned release (v2.1.0) — no core
# checkout required. Only the two thin services this iteration adds are built
# from source.
#
# Four things are deliberate and load-bearing:
#
#  1. nginx binds port 80, so PUBLIC_URL carries no port. A did:web with a port
#     needs it percent-encoded (did:web:localhost%3A8080:...), which silently
#     breaks issuer-DID matching in wallets and in our trust allowlist.
#  2. Vault runs in DEV mode: unsealed, fixed root token. The production file
#     backend must be initialised and unsealed by hand after every restart,
#     which is the single biggest obstacle to a one-command start.
#  3. One database for the showcase; use cases are separated by their own tables
#     (Age owns AgeCitizen). The registry names tables after the entity, so this
#     needs no schema or database per domain. tests/e2e/data-isolation.test.mjs
#     asserts the separation that matters: no shared cross-domain person table.
#  4. OID4VP request signing is ON, because Paradym (Credo-based) answers 406 to
#     an unsigned request object. That requires VERIFIER_DID to be a did:web —
#     oid4vc-service refuses to sign with a did:rcw.
#
# Synthetic data only. Never point this file at anything real.

name: sunbird-rc-age

services:
  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=registry
    volumes:
      # .sql, not .sh: a mounted shell script failed with "bad interpreter:
      # Permission denied" and the entrypoint started the server anyway, so the
      # databases and the `age` schema were silently missing.
      - ./init-db/01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
      - ./init-db/02-schemas.sql:/docker-entrypoint-initdb.d/02-schemas.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  vault:
    image: hashicorp/vault:1.13.3
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN:-local-root-token}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    command: server -dev
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:8200/v1/sys/health?standbyok=true || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  # Session store for oid4vc-service. Redis (not `memory`) because single-use
  # pre-authorised codes, c_nonces and VP transactions must behave the same way
  # across a service restart — the replay tests depend on it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # Age source data: the National Identity Authority's AgeCitizen records.
  # No Keycloak in this stack, so registry auth is off and age-issuer is the
  # only writer.
  registry:
    image: ghcr.io/sunbird-rc/sunbird-rc-core:${RELEASE_VERSION:-v2.1.0}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../registry-schemas:/home/sunbirdrc/config/public/_schemas
    env_file:
      - ./registry.env
    environment:
      - connectionInfo_uri=${AGE_REGISTRY_JDBC:-jdbc:postgresql://db:5432/registry}
      # Sunbird RC's own setting, used when the registry provisions Keycloak
      # users. This showcase does not use that path — `registry_base_apis_enable`
      # is false and the three realms are imported by bootstrap.sh — so the
      # default is a placeholder, not a credential. Kept out of registry.env
      # because env_file takes literals only, and a hardcoded password literal in
      # a tracked file is the first thing a secret scanner reports on a public
      # repository — quoting the old value here would defeat the point.
      - sunbird_keycloak_user_password=${REGISTRY_KEYCLOAK_USER_PASSWORD:-local-dev-placeholder}
      - authentication_enabled=${REGISTRY_AUTH_ENABLED:-false}
    healthcheck:
      # wget, not curl: the registry image ships wget but no curl, so a
      # curl-based probe reports unhealthy forever while the service is fine.
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:8081/health >/dev/null || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20
      # Java under amd64 emulation takes minutes to reach "Startup completed".
      # That is not a hang.
      start_period: 240s

  identity:
    image: ghcr.io/sunbird-rc/sunbird-rc-identity-service:${RELEASE_VERSION:-v2.1.0}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/identity
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-local-root-token}
      - VAULT_BASE_URL=http://vault:8200/v1/
      - VAULT_ROOT_PATH=kv
      - VAULT_TIMEOUT=10000
      - VAULT_PROXY=false
      - SIGNING_ALGORITHM=Ed25519Signature2020
      - ENABLE_AUTH=false
      # Bare host, NO scheme. getDidPrefixForBaseUrl strips only a literal
      # "https://" and then percent-encodes any remaining colon, so
      # "http://localhost" yields the malformed did:web:http%3A::localhost:<uuid>.
      - WEB_DID_BASE_URL=${PUBLIC_HOST:-localhost}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3332/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  credential-schema:
    image: ghcr.io/sunbird-rc/sunbird-rc-credential-schema:${RELEASE_VERSION:-v2.1.0}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/credential_schema
      - IDENTITY_BASE_URL=http://identity:3332
      - ENABLE_AUTH=false
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3333/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  credential:
    image: ghcr.io/sunbird-rc/sunbird-rc-credentials-service:${RELEASE_VERSION:-v2.1.0}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_healthy
      credential-schema:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/credential
      - IDENTITY_BASE_URL=http://identity:3332
      - SCHEMA_BASE_URL=http://credential-schema:3333
      - CREDENTIAL_SERVICE_BASE_URL=http://credential:3000
      - ENABLE_AUTH=false
      - QR_TYPE=W3C_VC
      # Revocation infrastructure is out of scope for the showcase (PRODUCT).
      # Left off knowingly: it means oid4vc-service's `revocation: OK` is a
      # default rather than a real status-list check. Recorded as a limitation.
      - STATUS_LIST_ENABLED=false
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  # The authorization server for wallet-driven issuance (charter Flow 1). The
  # citizen signs in here, inside the wallet's browser session, and the token it
  # mints carries the citizenId claim the issuer resolves to a registry record.
  #
  # Relative path /auth on purpose: it keeps everything on one origin behind
  # nginx, so the wallet, the issuer and the login page share a host and the
  # redirect URI stays stable.
  #
  # Realm is imported at start; passwords are NOT in the import. bootstrap.sh
  # sets them through the admin API and prints them once, because Anand's
  # answer 3 forbids committing them.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # Its realms now live in Postgres rather than an embedded H2 in the container's
    # writable layer, so it cannot start before the database is accepting connections.
    depends_on:
      db:
        condition: service_healthy
    platform: linux/amd64
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      # Behind nginx: Keycloak must build absolute URLs from the forwarded host,
      # or the login redirect sends the wallet somewhere it cannot reach.
      - KC_PROXY_HEADERS=xforwarded
      - KC_HEALTH_ENABLED=true
    volumes:
      # Keycloak's OWN database, and the reason it is here. `start-dev` keeps an embedded
      # H2 under /opt/keycloak/data/h2, which without a volume lives in the container's
      # writable layer and is destroyed the moment the container is recreated. --import-realm
      # then re-imports all four realms and Keycloak mints a NEW service-account user for
      # every client. The Authority Service's TenantMembership rows are in Postgres, which
      # IS durable, so they keep naming the previous subjects and every tenant becomes
      # invisible to its own administrator -- reported as "this resource already exists but
      # is not visible to the principal this script is using", which names neither Keycloak
      # nor the re-import. Found after an out-of-memory kill recreated the stack.
      - ./keycloak/realm-age.json:/opt/keycloak/data/import/realm-age.json:ro
      # A second realm for Iteration 02 rather than more accounts in `age`. The
      # subject claim differs — nationalId here, citizenId there — and that claim
      # is per-issuer-instance configuration, so one realm would mean accounts
      # carrying two identity claims for two unrelated purposes. It also leaves
      # the accepted Age accounts untouched, which Age regression depends on.
      - ./keycloak/realm-agriculture.json:/opt/keycloak/data/import/realm-agriculture.json:ro
      # And a third for Iteration 03, for the same reason. Education reuses
      # Agriculture's nationalId claim NAME, which is exactly why it must not
      # reuse its realm: an Agriculture login would otherwise satisfy an
      # Education issuer's subject lookup. Separate realms make that structural.
      - ./keycloak/realm-education.json:/opt/keycloak/data/import/realm-education.json:ro
      # And a fourth, holding no people at all: the machine principals the Authority
      # Service accepts. Kept apart from the three citizen realms so that a citizen's
      # token carries a different issuer from an issuing service's and therefore cannot
      # address the administrative API however its subject is spelled.
      - ./keycloak/realm-authority.json:/opt/keycloak/data/import/realm-authority.json:ro
    healthcheck:
      # A TCP connect, not an HTTP probe. The image ships no curl or wget, and
      # hand-rolling an HTTP request through bash's /dev/tcp means embedding CRLF
      # escapes in YAML — which is exactly how the first attempt silently failed
      # while Keycloak itself was up and the realm imported fine.
      #
      # This asserts only what a healthcheck can cheaply assert: the server is
      # listening. Realm readiness is a different claim, and bootstrap.sh proves
      # it properly by fetching the realm's OIDC discovery document.
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  # The OpenID4VCI / OpenID4VP protocol façade. Native to v2.1.0 — this is why
  # the architecture needs no standards adapter.
  oid4vc-service:
    image: ${OID4VC_IMAGE:-sunbird-rc-oid4vc-service:v2.1.0-authcode.714a8464}
    # NO platform pin, unlike registry/identity/credential: those are upstream
    # images published for amd64 only. This one is BUILT FROM SOURCE, so it is
    # whatever the machine that built it is -- arm64 on a Mac, amd64 on the
    # sandbox. Pinning amd64 here made compose ignore the locally built arm64
    # image and try to pull `sunbird-rc-oid4vc-service` from Docker Hub, where
    # no such repository exists: "pull access denied ... repository does not
    # exist", which names neither the platform nor the local image.
    restart: unless-stopped
    depends_on:
      credential:
        condition: service_healthy
      identity:
        condition: service_healthy
      credential-schema:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      PORT: '3400'
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      # In-network address identity-service uses to dereference this service.
      INTERNAL_URL: http://oid4vc-service:3400
      CREDENTIAL_SERVICE_BASE_URL: http://credential:3000
      IDENTITY_BASE_URL: http://identity:3332
      SCHEMA_BASE_URL: http://credential-schema:3333
      REDIS_URL: redis://redis:6379
      SESSION_STORE: redis
      # Fallback only: each schema is signed with its own `author` DID, which is
      # what makes the National Identity Authority the credential's `iss`.
      ISSUER_DID: ${AGE_ISSUER_DID:-}
      # Advertise only the credentials THIS issuer authored. credential-schema's
      # /oid4vci-configs is deployment-wide, so without this every issuer lists
      # every published credential — the Age issuer would offer the Agriculture
      # ones and both registries would offer each other's.
      ADVERTISE_OWN_CREDENTIALS_ONLY: 'true'
      # Paradym requires a signed request object; signing requires a
      # wallet-resolvable DID. Both are written by scripts/bootstrap.sh.
      OID4VP_SIGN_REQUEST: ${OID4VP_SIGN_REQUEST:-true}
      # Refuse a presentation that discloses more than the request asked for,
      # rather than dropping the extra claim before the relying service sees it.
      # Explicit although this is the build's default: it is a privacy guarantee
      # the acceptance table asserts, and a reader should not have to know the
      # default to see that it is on.
      REJECT_UNREQUESTED_DISCLOSURES: 'true'
      VERIFIER_DID: ${VERIFIER_DID:-}
      # Final OpenID4VCI 1.0 shapes. Paradym speaks final; DRAFT13 is Inji's
      # idiom and belongs to the Agriculture iteration.
      DRAFT13_COMPAT_MODE: 'false'
      ENABLE_AUTH: 'false'
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      # --- wallet-driven issuance (charter Flow 1) --------------------------
      # Presence of KEYCLOAK_PUBLIC_URL is the switch. Unset it and this build
      # behaves exactly like released v2.1.0: pre-authorised issuance only, and
      # metadata advertising only itself as the authorization server. That
      # opt-in shape is one of Anand's conditions for approving the capability.
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/auth
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: age
      # The claim the issuer trusts to decide WHOSE credential this is. Nothing
      # the wallet sends can override it.
      KEYCLOAK_SUBJECT_CLAIM: citizenId
      # Where the claims come from once the subject is known: the citizen's own
      # registry record, with ageOver18/ageOver21 derived from its date of birth.
      REGISTRY_BASE_URL: http://registry:8081
      REGISTRY_SUBJECT_ENTITY: AgeCitizen
      REGISTRY_SUBJECT_KEY: citizenId
      REGISTRY_BIRTHDATE_FIELD: dateOfBirth
      # What the citizen sees in the wallet's issuer list. Without it a wallet
      # has only the hostname to show, and the charter's "the citizen selects the
      # National Identity Authority" stops being a recognisable step.
      ISSUER_DISPLAY_NAME: National Identity Authority
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3400/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  # --- Iteration 02: the bank's own verifier identity --------------------------
  #
  # A fourth oid4vc-service instance whose ONLY job is to sign the bank's
  # OID4VP request objects, with the bank's own DID.
  #
  # Why it exists at all: the request object's signature is what a wallet uses to
  # name the requesting party on its consent screen. With one instance signing for
  # both use cases, the farmer's screen read "Do you trust Age Check?" while
  # applying for crop credit — the wallet was telling the truth about the key it
  # was shown, and the deployment was conflating two unrelated parties. That is
  # the same mistake DESIGN and bootstrap.sh already refuse between the issuer and
  # the verifier ("a separate identity because it is a separate party"); this
  # applies it to the second verifier.
  #
  # It issues nothing. No Keycloak, no registry, no ISSUER_DID: an instance that
  # could also issue would be a fifth issuer nobody asked for, and it would appear
  # in wallet issuer directories.
  oid4vc-bank:
    image: ${OID4VC_IMAGE:-sunbird-rc-oid4vc-service:v2.1.0-authcode.714a8464}
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy
      credential:
        condition: service_healthy
      credential-schema:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: '3400'
      # Published under its own path, so the request_uri the QR carries resolves
      # back to THIS instance. nginx strips the prefix (routes-citizen.conf).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/bank-vp
      INTERNAL_URL: http://oid4vc-bank:3400
      CREDENTIAL_SERVICE_BASE_URL: http://credential:3000
      IDENTITY_BASE_URL: http://identity:3332
      SCHEMA_BASE_URL: http://credential-schema:3333
      REDIS_URL: redis://redis:6379
      SESSION_STORE: redis
      OID4VP_SIGN_REQUEST: ${OID4VP_SIGN_REQUEST:-true}
      # Refuse a presentation that discloses more than the request asked for,
      # rather than dropping the extra claim before the relying service sees it.
      # Explicit although this is the build's default: it is a privacy guarantee
      # the acceptance table asserts, and a reader should not have to know the
      # default to see that it is on.
      REJECT_UNREQUESTED_DISCLOSURES: 'true'
      VERIFIER_DID: ${BANK_VERIFIER_DID:-}
      # Advertise nothing. This instance authored no schema, so with the filter on
      # its issuer metadata is empty — which is the intent: it is not an issuer.
      ADVERTISE_OWN_CREDENTIALS_ONLY: 'true'
      DRAFT13_COMPAT_MODE: 'false'
      ENABLE_AUTH: 'false'
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3400/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  # --- Iteration 02: the two Agriculture issuers -------------------------------
  #
  # Each registry is its OWN oid4vc-service instance, not a second credential on
  # the Age one. A wallet's issuer directory lists credential issuers, one per
  # credential_issuer URL, so two credentials served from one URL would appear as
  # a single issuer offering two — which is not what REQUIREMENTS §3 asks the demo
  # to show.
  #
  # The same image as the Age instance, unchanged: the fork made claim resolution
  # configuration rather than code, so declaring a different subject entity is all
  # that separating the two registries takes. That is also what makes the
  # separation structural — the Farmer instance is told about FarmerRecord and
  # declares no related entities, so no configuration exists by which it could
  # read a land record (DESIGN §4).

  oid4vc-farmer:
    image: ${OID4VC_IMAGE:-sunbird-rc-oid4vc-service:v2.1.0-authcode.714a8464}
    restart: unless-stopped
    depends_on:
      credential:
        condition: service_healthy
      identity:
        condition: service_healthy
      credential-schema:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      PORT: '3400'
      # The path is what makes this a distinct issuer to a wallet: its metadata
      # says credential_issuer = <host>/farmer, and nginx routes that prefix here.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/farmer
      INTERNAL_URL: http://oid4vc-farmer:3400
      CREDENTIAL_SERVICE_BASE_URL: http://credential:3000
      IDENTITY_BASE_URL: http://identity:3332
      SCHEMA_BASE_URL: http://credential-schema:3333
      REDIS_URL: redis://redis:6379
      SESSION_STORE: redis
      ISSUER_DID: ${FARMER_ISSUER_DID:-}
      # --- Authority Service as the claim source -------------------------------
      # Empty by default, which leaves this issuer reading the registry directly and
      # keeps a bare `docker compose up` working with no Authority at all. The values
      # are written to deploy/.env by scripts/bootstrap-agriculture-authority.sh, whose
      # profile ids are minted per deployment and cannot be committed.
      #
      # Authentication is CLIENT CREDENTIALS, not a static token: this service holds an
      # id and a secret and exchanges them whenever its token nears expiry. A token in
      # an environment variable cannot outlive its own expiry, so issuance would stop
      # some minutes after deployment with a 401 that reads like a permissions fault.
      CLAIM_SOURCE_DEFAULT: '${AGRI_CLAIM_SOURCE:-registry}'
      AUTHORITY_BASE_URL: '${AUTHORITY_BASE_URL:-}'
      AUTHORITY_SUBJECT_FIELD: '${AUTHORITY_SUBJECT_FIELD:-nationalId}'
      AUTHORITY_TOKEN_URL: '${AUTHORITY_TOKEN_URL:-}'
      AUTHORITY_PROFILE_MAP: '${AUTHORITY_PROFILE_MAP_FARMER:-}'
      AUTHORITY_CLIENT_ID: '${AUTHORITY_CLIENT_FARMER_OFFICER:-}'
      AUTHORITY_CLIENT_SECRET: '${AUTHORITY_SECRET_FARMER_OFFICER:-}'
      # Advertise only the credentials THIS issuer authored. credential-schema's
      # /oid4vci-configs is deployment-wide, so without this every issuer lists
      # every published credential — the Age issuer would offer the Agriculture
      # ones and both registries would offer each other's.
      ADVERTISE_OWN_CREDENTIALS_ONLY: 'true'
      DRAFT13_COMPAT_MODE: 'false'
      ENABLE_AUTH: 'false'
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/auth
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      # Its own realm: the subject claim differs from Age's, and that claim is
      # per-instance configuration, so one realm cannot carry both.
      KEYCLOAK_REALM: agriculture
      KEYCLOAK_SUBJECT_CLAIM: nationalId
      REGISTRY_BASE_URL: http://registry:8081
      REGISTRY_SUBJECT_ENTITY: FarmerRecord
      REGISTRY_SUBJECT_KEY: nationalId
      ISSUER_DISPLAY_NAME: Farmer Registry
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3400/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  oid4vc-land:
    image: ${OID4VC_IMAGE:-sunbird-rc-oid4vc-service:v2.1.0-authcode.714a8464}
    restart: unless-stopped
    depends_on:
      credential:
        condition: service_healthy
      identity:
        condition: service_healthy
      credential-schema:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      PORT: '3400'
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/land
      INTERNAL_URL: http://oid4vc-land:3400
      CREDENTIAL_SERVICE_BASE_URL: http://credential:3000
      IDENTITY_BASE_URL: http://identity:3332
      SCHEMA_BASE_URL: http://credential-schema:3333
      REDIS_URL: redis://redis:6379
      SESSION_STORE: redis
      ISSUER_DID: ${LAND_ISSUER_DID:-}
      # --- Authority Service as the claim source -------------------------------
      # Empty by default, which leaves this issuer reading the registry directly and
      # keeps a bare `docker compose up` working with no Authority at all. The values
      # are written to deploy/.env by scripts/bootstrap-agriculture-authority.sh, whose
      # profile ids are minted per deployment and cannot be committed.
      #
      # Authentication is CLIENT CREDENTIALS, not a static token: this service holds an
      # id and a secret and exchanges them whenever its token nears expiry. A token in
      # an environment variable cannot outlive its own expiry, so issuance would stop
      # some minutes after deployment with a 401 that reads like a permissions fault.
      CLAIM_SOURCE_DEFAULT: '${AGRI_CLAIM_SOURCE:-registry}'
      AUTHORITY_BASE_URL: '${AUTHORITY_BASE_URL:-}'
      AUTHORITY_SUBJECT_FIELD: '${AUTHORITY_SUBJECT_FIELD:-nationalId}'
      AUTHORITY_TOKEN_URL: '${AUTHORITY_TOKEN_URL:-}'
      AUTHORITY_PROFILE_MAP: '${AUTHORITY_PROFILE_MAP_LAND:-}'
      AUTHORITY_CLIENT_ID: '${AUTHORITY_CLIENT_LAND_OFFICER:-}'
      AUTHORITY_CLIENT_SECRET: '${AUTHORITY_SECRET_LAND_OFFICER:-}'
      # Advertise only the credentials THIS issuer authored. credential-schema's
      # /oid4vci-configs is deployment-wide, so without this every issuer lists
      # every published credential — the Age issuer would offer the Agriculture
      # ones and both registries would offer each other's.
      ADVERTISE_OWN_CREDENTIALS_ONLY: 'true'
      DRAFT13_COMPAT_MODE: 'false'
      ENABLE_AUTH: 'false'
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/auth
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: agriculture
      KEYCLOAK_SUBJECT_CLAIM: nationalId
      REGISTRY_BASE_URL: http://registry:8081
      # LandRecord carries its own nationalId so this issuer resolves the
      # authenticated farmer itself, rather than being handed a farmerId by
      # anyone. DESIGN §7: one issuer must not rely on another's unsigned state.
      REGISTRY_SUBJECT_ENTITY: LandRecord
      REGISTRY_SUBJECT_KEY: nationalId
      ISSUER_DISPLAY_NAME: Land Registry
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3400/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  # --- Iteration 03: the two Education relying parties ------------------------
  #
  # Two more OID4VP signers, for exactly the reason the bank needed its own: a
  # wallet names the requesting party from the key that SIGNED the request
  # object, so a shared signer makes two relying parties one party on the consent
  # screen. Education is the first iteration where a holder presents to both
  # parties in the same sitting, so getting this wrong would be visible in the
  # demo itself — the employer's screen would read "University Admissions".
  #
  # Neither issues anything. Both are published under their own path prefix so
  # the request_uri inside a QR resolves back to the instance that signed it.

  oid4vc-university-vp:
    image: ${OID4VC_IMAGE:-sunbird-rc-oid4vc-service:v2.1.0-authcode.714a8464}
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy
      credential:
        condition: service_healthy
      credential-schema:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: '3400'
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/university-vp
      INTERNAL_URL: http://oid4vc-university-vp:3400
      CREDENTIAL_SERVICE_BASE_URL: http://credential:3000
      IDENTITY_BASE_URL: http://identity:3332
      SCHEMA_BASE_URL: http://credential-schema:3333
      REDIS_URL: redis://redis:6379
      SESSION_STORE: redis
      OID4VP_SIGN_REQUEST: ${OID4VP_SIGN_REQUEST:-true}
      # Refuse a presentation that discloses more than the request asked for,
      # rather than dropping the extra claim before the relying service sees it.
      # Explicit although this is the build's default: it is a privacy guarantee
      # the acceptance table asserts, and a reader should not have to know the
      # default to see that it is on.
      REJECT_UNREQUESTED_DISCLOSURES: 'true'
      VERIFIER_DID: ${UNIVERSITY_VERIFIER_DID:-}
      # Advertise nothing: this instance authored no schema and is not an issuer.
      ADVERTISE_OWN_CREDENTIALS_ONLY: 'true'
      DRAFT13_COMPAT_MODE: 'false'
      ENABLE_AUTH: 'false'
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3400/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  oid4vc-employer-vp:
    image: ${OID4VC_IMAGE:-sunbird-rc-oid4vc-service:v2.1.0-authcode.714a8464}
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy
      credential:
        condition: service_healthy
      credential-schema:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: '3400'
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/employer-vp
      INTERNAL_URL: http://oid4vc-employer-vp:3400
      CREDENTIAL_SERVICE_BASE_URL: http://credential:3000
      IDENTITY_BASE_URL: http://identity:3332
      SCHEMA_BASE_URL: http://credential-schema:3333
      REDIS_URL: redis://redis:6379
      SESSION_STORE: redis
      OID4VP_SIGN_REQUEST: ${OID4VP_SIGN_REQUEST:-true}
      # Refuse a presentation that discloses more than the request asked for,
      # rather than dropping the extra claim before the relying service sees it.
      # Explicit although this is the build's default: it is a privacy guarantee
      # the acceptance table asserts, and a reader should not have to know the
      # default to see that it is on.
      REJECT_UNREQUESTED_DISCLOSURES: 'true'
      VERIFIER_DID: ${EMPLOYER_VERIFIER_DID:-}
      # Advertise nothing: this instance authored no schema and is not an issuer.
      ADVERTISE_OWN_CREDENTIALS_ONLY: 'true'
      DRAFT13_COMPAT_MODE: 'false'
      ENABLE_AUTH: 'false'
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3400/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  # --- Iteration 03: three independent Education issuers ----------------------
  #
  # Three instances, not one with three schemas. REQUIREMENTS §3 asks for three
  # institutions that do not know about each other, and the reason is the rule the
  # verifier has to enforce: a learner's three certificates come from three
  # separate authorities, so "they all name the same learner" is a claim the
  # verifier must establish, not an invariant one issuer can guarantee by
  # construction. Sharing an instance would make the correlation check untestable —
  # one issuer minting all three from one lookup can never disagree with itself.
  #
  # Each therefore has its own path (a distinct credential_issuer to a wallet), its
  # own signing DID, and its own registry entity, and reads only the nationalId in
  # the learner's own access token. None of them is handed a learnerId by anyone.

  oid4vc-school:
    image: ${OID4VC_IMAGE:-sunbird-rc-oid4vc-service:v2.1.0-authcode.714a8464}
    restart: unless-stopped
    depends_on:
      credential:
        condition: service_healthy
      identity:
        condition: service_healthy
      credential-schema:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      PORT: '3400'
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/school
      INTERNAL_URL: http://oid4vc-school:3400
      CREDENTIAL_SERVICE_BASE_URL: http://credential:3000
      IDENTITY_BASE_URL: http://identity:3332
      SCHEMA_BASE_URL: http://credential-schema:3333
      REDIS_URL: redis://redis:6379
      SESSION_STORE: redis
      ISSUER_DID: ${SCHOOL_ISSUER_DID:-}
      # --- Authority Service as the claim source -------------------------------
      # The same pattern Agriculture uses, and for the same reason: the approved
      # Authority-managed record is the source of the claims, not this registry. Empty
      # by default, so a bare `docker compose up` still works with no Authority at all.
      # Written to deploy/.env by scripts/bootstrap-education-authority.sh; the profile
      # ids are minted per deployment and cannot be committed.
      #
      # Each issuer is given ONLY its own profile map and its own client credentials, so
      # one Education issuer cannot be made to produce the other's credential.
      #
      # Authentication is CLIENT CREDENTIALS rather than a static token: a token in an
      # environment variable cannot outlive its own expiry, so issuance would stop some
      # minutes after deployment with a 401 that reads like a permissions fault.
      CLAIM_SOURCE_DEFAULT: '${EDU_CLAIM_SOURCE:-registry}'
      AUTHORITY_BASE_URL: '${AUTHORITY_BASE_URL:-}'
      AUTHORITY_SUBJECT_FIELD: '${AUTHORITY_SUBJECT_FIELD:-nationalId}'
      AUTHORITY_TOKEN_URL: '${AUTHORITY_TOKEN_URL:-}'
      AUTHORITY_PROFILE_MAP: '${AUTHORITY_PROFILE_MAP_SCHOOL:-}'
      AUTHORITY_CLIENT_ID: '${AUTHORITY_CLIENT_SCHOOL_OFFICER:-}'
      AUTHORITY_CLIENT_SECRET: '${AUTHORITY_SECRET_SCHOOL_OFFICER:-}'
      ADVERTISE_OWN_CREDENTIALS_ONLY: 'true'
      DRAFT13_COMPAT_MODE: 'false'
      ENABLE_AUTH: 'false'
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/auth
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: education
      KEYCLOAK_SUBJECT_CLAIM: nationalId
      REGISTRY_BASE_URL: http://registry:8081
      # SchoolRecord carries its own nationalId, so this issuer resolves the authenticated learner itself. DESIGN §7: no issuer relies on another's unsigned state.
      REGISTRY_SUBJECT_ENTITY: SchoolRecord
      REGISTRY_SUBJECT_KEY: nationalId
      ISSUER_DISPLAY_NAME: State School Board
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3400/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  oid4vc-college:
    image: ${OID4VC_IMAGE:-sunbird-rc-oid4vc-service:v2.1.0-authcode.714a8464}
    restart: unless-stopped
    depends_on:
      credential:
        condition: service_healthy
      identity:
        condition: service_healthy
      credential-schema:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      PORT: '3400'
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/college
      INTERNAL_URL: http://oid4vc-college:3400
      CREDENTIAL_SERVICE_BASE_URL: http://credential:3000
      IDENTITY_BASE_URL: http://identity:3332
      SCHEMA_BASE_URL: http://credential-schema:3333
      REDIS_URL: redis://redis:6379
      SESSION_STORE: redis
      ISSUER_DID: ${COLLEGE_ISSUER_DID:-}
      # --- Authority Service as the claim source -------------------------------
      # The same pattern Agriculture uses, and for the same reason: the approved
      # Authority-managed record is the source of the claims, not this registry. Empty
      # by default, so a bare `docker compose up` still works with no Authority at all.
      # Written to deploy/.env by scripts/bootstrap-education-authority.sh; the profile
      # ids are minted per deployment and cannot be committed.
      #
      # Each issuer is given ONLY its own profile map and its own client credentials, so
      # one Education issuer cannot be made to produce the other's credential.
      #
      # Authentication is CLIENT CREDENTIALS rather than a static token: a token in an
      # environment variable cannot outlive its own expiry, so issuance would stop some
      # minutes after deployment with a 401 that reads like a permissions fault.
      CLAIM_SOURCE_DEFAULT: '${EDU_CLAIM_SOURCE:-registry}'
      AUTHORITY_BASE_URL: '${AUTHORITY_BASE_URL:-}'
      AUTHORITY_SUBJECT_FIELD: '${AUTHORITY_SUBJECT_FIELD:-nationalId}'
      AUTHORITY_TOKEN_URL: '${AUTHORITY_TOKEN_URL:-}'
      AUTHORITY_PROFILE_MAP: '${AUTHORITY_PROFILE_MAP_COLLEGE:-}'
      AUTHORITY_CLIENT_ID: '${AUTHORITY_CLIENT_COLLEGE_OFFICER:-}'
      AUTHORITY_CLIENT_SECRET: '${AUTHORITY_SECRET_COLLEGE_OFFICER:-}'
      ADVERTISE_OWN_CREDENTIALS_ONLY: 'true'
      DRAFT13_COMPAT_MODE: 'false'
      ENABLE_AUTH: 'false'
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/auth
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: education
      KEYCLOAK_SUBJECT_CLAIM: nationalId
      REGISTRY_BASE_URL: http://registry:8081
      # Its own entity and its own nationalId lookup: the college has never heard of the school.
      REGISTRY_SUBJECT_ENTITY: CollegeRecord
      REGISTRY_SUBJECT_KEY: nationalId
      ISSUER_DISPLAY_NAME: Regional Polytechnic College
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3400/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  oid4vc-university:
    image: ${OID4VC_IMAGE:-sunbird-rc-oid4vc-service:v2.1.0-authcode.714a8464}
    restart: unless-stopped
    depends_on:
      credential:
        condition: service_healthy
      identity:
        condition: service_healthy
      credential-schema:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      PORT: '3400'
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/university
      INTERNAL_URL: http://oid4vc-university:3400
      CREDENTIAL_SERVICE_BASE_URL: http://credential:3000
      IDENTITY_BASE_URL: http://identity:3332
      SCHEMA_BASE_URL: http://credential-schema:3333
      REDIS_URL: redis://redis:6379
      SESSION_STORE: redis
      ISSUER_DID: ${UNIVERSITY_ISSUER_DID:-}
      ADVERTISE_OWN_CREDENTIALS_ONLY: 'true'
      DRAFT13_COMPAT_MODE: 'false'
      ENABLE_AUTH: 'false'
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_URL:-http://localhost}/auth
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: education
      KEYCLOAK_SUBJECT_CLAIM: nationalId
      REGISTRY_BASE_URL: http://registry:8081
      # The university likewise. It carries degreeLevel and fieldOfStudy, which only it is authoritative for.
      REGISTRY_SUBJECT_ENTITY: UniversityRecord
      REGISTRY_SUBJECT_KEY: nationalId
      ISSUER_DISPLAY_NAME: State University
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3400/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  # --- what this iteration adds -----------------------------------------------

  # Issuer-side backend for the National Identity Authority. Reads AgeCitizen
  # records through the registry API (never the tables), derives the age
  # assertions, and asks oid4vc-service for a credential offer.
  age-issuer:
    build:
      context: ../services/age-issuer
    restart: unless-stopped
    depends_on:
      registry:
        condition: service_healthy
      oid4vc-service:
        condition: service_healthy
    environment:
      PORT: '4200'
      REGISTRY_BASE_URL: http://registry:8081
      OID4VC_BASE_URL: http://oid4vc-service:3400
      SCHEMA_BASE_URL: http://credential-schema:3333
      CREDENTIAL_NAME: Age Verification Credential
      CREDENTIAL_FORMAT: vc+sd-jwt
      # Disambiguates the credential configuration by author. The negative-path
      # fixtures create a SECOND schema with the same name and vct under an
      # untrusted issuer, so resolving by name alone would be ambiguous.
      AGE_ISSUER_DID: ${AGE_ISSUER_DID:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:4200/healthz >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

  # The reusable verifier service. Generic protocol/trust/policy handling with
  # the Age decision isolated in one module — iterations 2 and 3 extend this
  # rather than reimplementing verification.
  verifier:
    build:
      context: ../services/verifier
    restart: unless-stopped
    depends_on:
      oid4vc-service:
        condition: service_healthy
    volumes:
      - ../config/trust:/app/config/trust:ro
      # The Agriculture lending policy. Mounted read-only and version-controlled
      # for the same reason as the trust allowlist: the per-acre rate is what
      # turns verified acreage into a rupee figure a customer reads off a screen,
      # so it must not be editable between demos.
      - ../config/policy:/app/config/policy:ro
    environment:
      PORT: '4300'
      OID4VC_BASE_URL: http://oid4vc-service:3400
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      # The Agriculture policy resolves Farmer and Land from the Authority Service
      # instead of naming their DIDs, so it is selected only once that Authority is
      # configured. bootstrap-agriculture-authority.sh writes the override.
      TRUST_POLICY_FILE: '${VERIFIER_TRUST_POLICY_FILE:-/app/config/trust/issuers.json}'
      AUTHORITY_BASE_URL: '${AUTHORITY_BASE_URL:-}'
      CROP_POLICY_FILE: /app/config/policy/crop-rates.json
      # The approved-algorithm allowlist (REQUIREMENTS §8), enforced rather than
      # recorded. Named explicitly even though it defaults to this path, because a
      # security control that is easy to overlook in configuration is easy to lose.
      ALG_POLICY_FILE: /app/config/policy/algorithms.json
      # How long a presentation request stays answerable. 300s matches
      # oid4vc-service's VP_TXN_TTL. Lower it on a demo host (90s or so) when you
      # need the "nobody answered" outcome to land while an audience is watching:
      # a declining wallet tells the verifier nothing, so expiry is the only
      # signal that no presentation is coming.
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-300}
      # Expanded into the trust policy at load time, so the committed policy
      # file stays stable across deployments while the pinned DID does not.
      # All six are required once the policy names them: the loader treats an
      # unset variable as a hard failure rather than a wildcard, so the verifier
      # refuses to start rather than trusting an issuer whose DID is the empty
      # string. scripts/bootstrap.sh writes all of them.
      AGE_ISSUER_DID: ${AGE_ISSUER_DID:-}
      FARMER_ISSUER_DID: ${FARMER_ISSUER_DID:-}
      LAND_ISSUER_DID: ${LAND_ISSUER_DID:-}
      SCHOOL_ISSUER_DID: ${SCHOOL_ISSUER_DID:-}
      COLLEGE_ISSUER_DID: ${COLLEGE_ISSUER_DID:-}
      UNIVERSITY_ISSUER_DID: ${UNIVERSITY_ISSUER_DID:-}
      # Which signer the BANK's presentation requests come from. Age keeps the
      # instance it always used (OID4VC_BASE_URL below); agriculture requests are
      # signed by the bank's own identity, so the wallet's consent screen names
      # the bank rather than the age-restricted service.
      OID4VC_BANK_BASE_URL: http://oid4vc-bank:3400
      OID4VC_UNIVERSITY_VP_BASE_URL: http://oid4vc-university-vp:3400
      OID4VC_EMPLOYER_VP_BASE_URL: http://oid4vc-employer-vp:3400
      # The credential types the bank's request pins, one per issuer instance.
      FARMER_VCT: ${PUBLIC_URL:-http://localhost}/farmer/vct/farmer-identity-credential
      LAND_VCT: ${PUBLIC_URL:-http://localhost}/land/vct/land-ownership-credential
      # And one per Education institution, each served by its own instance under
      # its own prefix. The verifier PINS these: a credential whose vct is not the
      # one this slot names is not the credential that was asked for, however
      # valid its signature.
      SCHOOL_VCT: ${PUBLIC_URL:-http://localhost}/school/vct/school-record-credential
      COLLEGE_VCT: ${PUBLIC_URL:-http://localhost}/college/vct/college-record-credential
      UNIVERSITY_VCT: ${PUBLIC_URL:-http://localhost}/university/vct/university-record-credential
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:4300/healthz >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

  # The Authority Service. Pinned by digest, not by tag: a tag can be moved and a
  # demo would then verify something other than what was accepted.
  #
  # Multi-architecture (linux/amd64 and linux/arm64), so it needs no platform pin
  # and runs natively on the demo host and on a development machine alike.
  authority-service:
    # Overridable so a locally built authority-service can be run against this stack
    # without editing a tracked digest. The published digest stays the default, so an
    # unset variable reproduces the deployment exactly.
    image: ${AUTHORITY_SERVICE_IMAGE:-ghcr.io/pallakartheekreddy/sunbird-rc-authority-service@sha256:56333d4561bff7222db34c6089d0cf857a69cb6a156037d25c1650e14e2b70e3}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      registry:
        condition: service_healthy
    environment:
      PORT: '3334'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/authority?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/authority_shadow?schema=public
      RC_REGISTRY_URL: http://registry:8081
      CREDENTIALS_SERVICE_URL: http://credential:3000
      # Authentication is ON unless explicitly disabled, and the compose file will
      # not be the thing that disables it. ENABLE_AUTH=false is a local-development
      # escape hatch that belongs in a developer's shell, not in a committed
      # default where it would be inherited silently by a demo host.
      ENABLE_AUTH: '${ENABLE_AUTH:-true}'
      # Creating a root tenant requires a principal named here. Empty by default,
      # which disables root tenant creation rather than granting it to anyone.
      BOOTSTRAP_ADMINS: '${BOOTSTRAP_ADMINS:-}'
      # NOTE the /auth prefix. Keycloak runs with --http-relative-path=/auth, so the
      # realm lives at /auth/realms/authority and the `iss` claim it stamps into every
      # token carries that prefix too. Without it the JWKS URI 404s and the issuer
      # comparison can never match, so EVERY token is rejected as invalid — which reads
      # like a key problem and is a path problem.
      OIDC_ISSUER: '${AUTHORITY_OIDC_ISSUER:-http://keycloak:8080/auth/realms/authority}'
      OIDC_JWKS_URI: '${AUTHORITY_OIDC_JWKS_URI:-http://keycloak:8080/auth/realms/authority/protocol/openid-connect/certs}'
    ports:
      # Loopback only. The administrative API is authenticated but not public, and
      # binding it to 127.0.0.1 keeps it off the host's network interfaces the way
      # the registry's operator routes already are. The public trust routes are
      # reached through nginx, not here.
      - '127.0.0.1:3334:3334'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3334/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      oid4vc-service:
        condition: service_healthy
      # service_started, NOT service_healthy, for the two services this
      # iteration adds. The verifier fails closed at boot when it has no
      # trusted issuer DID, and that DID is minted by scripts/bootstrap.sh —
      # which needs this gateway to reach /did/generate. Waiting for verifier
      # health here would deadlock the first run of a clean checkout.
      #
      # Safe because every proxy_pass in nginx.conf goes through a variable
      # plus `resolver`, so nginx resolves the upstream per request instead of
      # caching it at startup: a service that is briefly down 502s and then
      # works, rather than requiring an nginx reload.
      verifier:
        condition: service_started
      age-issuer:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # The routes themselves, shared with the TLS overlay so both schemes serve
      # exactly the same gateway. Split by audience: citizen/wallet routes are
      # public, operator routes are served only on the loopback listener below.
      - ./nginx/routes-citizen.conf:/etc/nginx/routes-citizen.conf:ro
      - ./nginx/routes-ops.conf:/etc/nginx/routes-ops.conf:ro
      - ./nginx/routes-trust.conf:/etc/nginx/routes-trust.conf:ro
      - ./nginx/routes-denied.conf:/etc/nginx/routes-denied.conf:ro
      # The web pages are static and need no build step, so nginx serves them
      # directly instead of a container existing to hold a handful of files.
      - ../services/verifier-web:/usr/share/nginx/html/verifier:ro
      - ../services/bank-web:/usr/share/nginx/html/bank:ro
      # One directory, mounted once, serving both Education pages. See the
      # /admissions/ and /employer/ locations in routes-citizen.conf.
      - ../services/education-web:/usr/share/nginx/html/education:ro
      - ../services/web-assets:/usr/share/nginx/html/assets:ro
    ports:
      # Port 80 on purpose — see the header note about did:web and ports.
      - '80:80'
      # The operator listener: bound to 127.0.0.1, so the unauthenticated
      # registry/DID/schema endpoints are reachable from THIS machine only.
      # bootstrap.sh, the seed script and the test suites use it. From another
      # machine: ssh -L 8088:127.0.0.1:8088 user@host
      - '127.0.0.1:8088:8088'
    healthcheck:
      # 127.0.0.1, not localhost: inside the container `localhost` resolves to
      # [::1] first and the server block only listens on IPv4, so an otherwise
      # healthy gateway reports "connection refused".
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1/gateway-health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

